[project]
name = "question-recommender"
version = "0.1.0"
description = "个性化推荐题目 - 实习面试项目"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
